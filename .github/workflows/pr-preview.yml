name: pr-preview

# Gives each website pull request a stable preview address:
# pr-<number>.preview.bowerloom.ai. This workflow never checks out code.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/landing/**"
      - "release/**"

permissions:
  contents: read
  pull-requests: write
  deployments: read

env:
  # Exact Vercel CLI version. Change it here only.
  VERCEL_CLI_VERSION: "65.11.0"
  VERCEL_SCOPE: sageadvicellc
  VERCEL_PROJECT: bowerloom-preview
  PREVIEW_DOMAIN: preview.bowerloom.ai

jobs:
  alias:
    name: Alias the preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pr-preview-alias-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Wait for the Vercel build, alias it, and comment
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::The VERCEL_TOKEN secret is not set. Skipping the preview alias."
            exit 0
          fi
          echo "::add-mask::$VERCEL_TOKEN"

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull request number is not numeric."
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The head sha is not a full commit sha."
            exit 1
          fi

          # Poll Vercel for a READY deployment of this commit. Vercel skips a
          # build when the latest commit does not touch apps/landing or release/.
          DEPLOY_URL=""
          for attempt in $(seq 1 40); do
            LIST_JSON="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" list "$VERCEL_PROJECT" \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --meta "githubCommitSha=${HEAD_SHA}" --status READY --json 2>/dev/null || true)"
            CANDIDATE="$(printf '%s' "$LIST_JSON" | jq -r \
              '(if type == "object" then .deployments else . end) | if type == "array" then . else [] end | map(select(.url != null)) | first | .url // empty' 2>/dev/null || true)"
            if [ -n "$CANDIDATE" ]; then
              case "$CANDIDATE" in
                https://*) DEPLOY_URL="$CANDIDATE" ;;
                *) DEPLOY_URL="https://${CANDIDATE}" ;;
              esac
              break
            fi
            echo "Attempt ${attempt}: no ready deployment yet."
            sleep 15
          done

          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::No ready Vercel deployment for ${HEAD_SHA} within about 10 minutes. Vercel may have skipped the build. The pull request keeps its last alias."
            exit 0
          fi
          if ! [[ "$DEPLOY_URL" =~ ^https://[a-z0-9-]+-sageadvicellc\.vercel\.app$ ]]; then
            echo "::error::The deployment URL is not a sageadvicellc Vercel address."
            exit 1
          fi

          ALIAS_HOST="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set "$DEPLOY_URL" "$ALIAS_HOST" \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

          MARKER="<!-- bowerloom-pr-preview -->"
          BODY="${MARKER}
          Preview for this pull request: https://${ALIAS_HOST}

          Latest build: ${DEPLOY_URL}
          Commit: ${HEAD_SHA}

          The preview needs a login to the Vercel team. Ask a team member if you cannot open it."

          COMMENT_ID="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
            echo "Updated comment ${COMMENT_ID}."
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
            echo "Posted a new comment."
          fi

  cleanup:
    name: Remove the preview alias
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove the alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::The VERCEL_TOKEN secret is not set. Skipping the alias removal."
            exit 0
          fi
          echo "::add-mask::$VERCEL_TOKEN"

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull request number is not numeric."
            exit 1
          fi

          ALIAS_HOST="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          if ! npx --yes "vercel@${VERCEL_CLI_VERSION}" alias rm "$ALIAS_HOST" --yes \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; then
            echo "::notice::Could not remove ${ALIAS_HOST}. It may already be gone."
          fi
