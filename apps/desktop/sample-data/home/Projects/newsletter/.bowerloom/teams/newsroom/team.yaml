format: trellis/crew/v0.7-alpha
id: newsroom
description: "newsroom: An R&D team for a reproducible comparison protocol and methods review. Built
  from fixed templates and review-required. Brief
  sha256:479b6afe25e2bbb9a9637455b8b9a6197d0fd0a7b506b490358b97882d56f022."
requiredCapabilities:
  - workspace.write
  - approval.exact-revision
budget:
  maxActiveWorkers: 2
  reservePercent: 25
  paidFallback: false
scope:
  - operation: workspace.write
    path: output/scope.md
  - operation: workspace.write
    path: output/draft.md
  - operation: workspace.write
    path: output/review.md
assets:
  project-brief:
    path: assets/brief.json
    mediaType: application/json
  working-agreement:
    path: assets/working-agreement.md
    mediaType: text/markdown
  milestones:
    path: assets/milestones.md
    mediaType: text/markdown
  lead-prompt:
    path: prompts/lead.md
    mediaType: text/markdown
  maker-prompt:
    path: prompts/maker.md
    mediaType: text/markdown
  reviewer-prompt:
    path: prompts/reviewer.md
    mediaType: text/markdown
  bounded-draft:
    path: skills/bounded-draft.md
    mediaType: text/markdown
  relay-map:
    path: maps/relay.json
    mediaType: application/json
  vines-map:
    path: maps/vines.json
    mediaType: application/json
owners:
  - id: lead
    role: Experiment lead
    prompt: lead-prompt
    skills:
      - bounded-draft
    modelClass: standard
    permissions:
      - operation: workspace.write
        path: output/scope.md
  - id: maker
    role: Protocol maker
    prompt: maker-prompt
    skills:
      - bounded-draft
    modelClass: economy
    permissions:
      - operation: workspace.write
        path: output/draft.md
  - id: reviewer
    role: Methods reviewer
    prompt: reviewer-prompt
    skills:
      - bounded-draft
    modelClass: economy
    permissions:
      - operation: workspace.write
        path: output/review.md
tasks:
  - id: scope
    owner: lead
    description: Propose a bounded research question and testable hypothesis from the explicit brief.
      Specify a baseline, candidate, primary measure, supplied dataset, repeat count, stopping rule,
      and missing evidence.
    dependsOn: []
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/scope.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
  - id: draft
    owner: maker
    description: Draft a repeatable A/B protocol from the accepted scope and supplied assets. Define
      frozen inputs, independent runs, comparison method, logging fields, confounders, and how
      inconclusive results will be reported. Do not run experiments or fabricate measurements.
    dependsOn:
      - scope
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
      scope:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: scope
          output: document
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/draft.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
  - id: review
    owner: reviewer
    description: Compare the protocol with the accepted scope and brief. Check fair baseline treatment,
      repeatability, data provenance, leakage, confounders, and unsupported improvement claims. Keep
      planned tests distinct from measured results.
    dependsOn:
      - draft
      - scope
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
      draft:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: draft
          output: document
      scope:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: scope
          output: document
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/review.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
