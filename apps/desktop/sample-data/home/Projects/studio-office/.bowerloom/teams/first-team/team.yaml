format: trellis/crew/v0.7-alpha
id: first-team
description: "studio-crew: A project team for a bounded implementation and code review. Built from
  fixed templates and review-required. Brief
  sha256:69abdf874d4cd4b32b4e02fbfb6cd22729b915fe8076894571b9bf679f1a183d."
requiredCapabilities:
  - workspace.write
  - approval.exact-revision
budget:
  maxActiveWorkers: 2
  reservePercent: 25
  paidFallback: false
scope:
  - operation: workspace.write
    path: output/scope.md
  - operation: workspace.write
    path: output/draft.md
  - operation: workspace.write
    path: output/review.md
assets:
  project-brief:
    path: assets/brief.json
    mediaType: application/json
  working-agreement:
    path: assets/working-agreement.md
    mediaType: text/markdown
  milestones:
    path: assets/milestones.md
    mediaType: text/markdown
  lead-prompt:
    path: prompts/lead.md
    mediaType: text/markdown
  maker-prompt:
    path: prompts/maker.md
    mediaType: text/markdown
  reviewer-prompt:
    path: prompts/reviewer.md
    mediaType: text/markdown
  bounded-draft:
    path: skills/bounded-draft.md
    mediaType: text/markdown
  relay-map:
    path: maps/relay.json
    mediaType: application/json
  vines-map:
    path: maps/vines.json
    mediaType: application/json
owners:
  - id: lead
    role: Engineering lead
    prompt: lead-prompt
    skills:
      - bounded-draft
    modelClass: standard
    permissions:
      - operation: workspace.write
        path: output/scope.md
  - id: maker
    role: Implementation maker
    prompt: maker-prompt
    skills:
      - bounded-draft
    modelClass: economy
    permissions:
      - operation: workspace.write
        path: output/draft.md
  - id: reviewer
    role: Code reviewer
    prompt: reviewer-prompt
    skills:
      - bounded-draft
    modelClass: economy
    permissions:
      - operation: workspace.write
        path: output/review.md
tasks:
  - id: scope
    owner: lead
    description: Propose a bounded implementation scope from the explicit brief. Define interface
      changes, allowed files, meaningful checks, and acceptance criteria. Identify missing
      repository evidence without collecting it.
    dependsOn: []
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/scope.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
  - id: draft
    owner: maker
    description: Draft an implementation proposal from the accepted scope and supplied assets. Explain
      the intended change, test cases, failure behavior, and unresolved dependencies. Do not claim
      code changes or passing tests that have not happened.
    dependsOn:
      - scope
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
      scope:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: scope
          output: document
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/draft.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
  - id: review
    owner: reviewer
    description: Compare the implementation proposal with the accepted scope and brief. Check
      correctness, security boundaries, test relevance, and missing evidence. Record concrete
      findings for the user.
    dependsOn:
      - draft
      - scope
    requires:
      - workspace.write
      - approval.exact-revision
    inputs:
      brief:
        type:
          kind: artifact
          mediaType: application/json
        source:
          asset: project-brief
      agreement:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: working-agreement
      milestones:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          asset: milestones
      draft:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: draft
          output: document
      scope:
        type:
          kind: artifact
          mediaType: text/markdown
        source:
          task: scope
          output: document
    outputs:
      document:
        kind: artifact
        mediaType: text/markdown
    effects:
      - operation: workspace.write
        path: output/review.md
    approval: required
    policy:
      maxAttempts: 1
      timeoutSeconds: 300
      deadlineSeconds: 1800
      backoffSeconds: 0
      onFailure: escalate
    acceptance:
      - The document stays within the explicit brief and accepted inputs.
      - Facts, assumptions, missing evidence, and the proposed next review are distinct.
      - The user can inspect the proposed document before an authorized write.
