<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bowerloom app icon</title>
  <!-- The macOS app icon: the S4-G3 mascot on a cream tile, on Apple's 1024 px icon grid. The tile is an 824 px rounded square inset 100 px, with a soft
       shadow, and a sage strip along the bottom. tools/render-app-icon.mjs draws it and builds build/icon.icns and build/icon.png. -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
    .tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; overflow: hidden; border-radius: 185px; background: radial-gradient(circle at 30% 20%, #FFF9F4, #F6EEE8 55%, #EFD9D6); box-shadow: 0 12px 24px rgb(20 16 24 / .28), 0 2px 4px rgb(20 16 24 / .2); }
    .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 0 rgb(255 255 255 / .45), inset 0 -6px 12px rgb(20 16 24 / .12); }
    .mascot { position: absolute; left: 50%; top: 50%; width: 600px; height: 600px; transform: translate(-50%, -47%); filter: drop-shadow(0 18px 18px rgb(20 16 24 / .28)); }
    .leaf { position: absolute; inset: auto 0 0; height: 64px; background: #B9C6A0; }
  </style>
</head>
<body>
  <div class="tile"><img class="mascot" src="/mascot.svg" alt="S4-G3" width="512" height="512"><div class="leaf"></div></div>
</body>
</html>
